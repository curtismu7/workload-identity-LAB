services:
  workload-identity-lab:
    build: .
    container_name: workload-identity-lab
    ports:
      - "127.0.0.1:7816:7816"
    restart: unless-stopped
    environment:
      - PORT=7816
      - LAB_ALLOWED_HOSTS=localhost,127.0.0.1,local.ping-devops.com,workload-identity-lab,workload-identity-lab.local.ping-devops.com
    # Real mode (owner-only): the four WI_REAL_* values live in the app's own .env, never committed
    # and never built into the image (.dockerignore). See .env.example. Optional: Mock runs without it.
    env_file:
      - path: .env
        required: false
    read_only: false
